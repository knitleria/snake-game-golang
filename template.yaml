AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Snake global leaderboard API

Parameters:
  StageName:
    Type: String
    Default: prod
  MinClientVersion:
    Type: String
    Default: "1.0.5"
    Description: Minimum client version accepted by POST /api/v1/scores. Empty disables the gate.
  LatestClientVersion:
    Type: String
    Default: "1.0.5"
    Description: Latest client version advertised on GET /api/v1/version.

Resources:
  LeaderboardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: LeaderboardIndex
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  LeaderboardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
        AllowOrigins:
          - "*"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  LeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          LEADERBOARD_TABLE: !Ref LeaderboardTable
          LEADERBOARD_INDEX: LeaderboardIndex
          LEADERBOARD_ENV: production
          MAX_SCORE: "1199"
          MIN_CLIENT_VERSION: !Ref MinClientVersion
          LATEST_CLIENT_VERSION: !Ref LatestClientVersion
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LeaderboardTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeaderboardApi
            Path: /healthz
            Method: GET
        CreateScore:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeaderboardApi
            Path: /api/v1/scores
            Method: POST
        GetLeaderboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeaderboardApi
            Path: /api/v1/leaderboard
            Method: GET
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: snake-leaderboard

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${LeaderboardApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
